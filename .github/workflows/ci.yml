name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    # Todo en frío (sin caché): en Windows se estima 18–28 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `jase --smoke` abre una ventana: en Linux, sobre un X11 virtual.
      - name: X11 virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast

      - name: Clippy (map-images)
        run: cargo clippy -p jase-core --all-targets --features map-images -- -D warnings

      - name: Tests (map-images)
        run: cargo test -p jase-core --features map-images
