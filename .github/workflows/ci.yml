name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # PySide6 6.12.0 con Python < 3.12 resta una referencia a None en cada llamada void
          # de QPainter (None no es inmortal hasta 3.12) y el proceso aborta: 3.11 usa 6.11.2.
          - os: ubuntu-latest
            python: "3.11"
            pyside: "6.11.2"
          - os: windows-latest
            python: "3.13"
            pyside: "6.12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Librerías de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: python -m pip install ".[dev]" "PySide6==${{ matrix.pyside }}"

      - name: Ruff
        if: runner.os == 'Linux'
        run: ruff check src tests scripts

      - name: Mypy
        if: runner.os == 'Linux'
        run: mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -W error
