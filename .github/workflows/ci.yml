name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # PySide6 6.12.0 con Python < 3.12 resta una referencia a None en cada llamada void
          # de QPainter (None no es inmortal hasta 3.12) y el proceso aborta: 3.11 usa 6.11.2.
          - os: ubuntu-latest
            python: "3.11"
            pyside: "6.11.2"
          - os: windows-latest
            python: "3.13"
            pyside: "6.12.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Librerías de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: python -m pip install ".[dev]" "PySide6==${{ matrix.pyside }}"

      - name: Ruff
        if: runner.os == 'Linux'
        run: ruff check src tests scripts

      - name: Mypy
        if: runner.os == 'Linux'
        run: mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -W error

  rust:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    # Todo en frío (sin caché): en Windows se estima 18–28 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `jase --smoke` abre una ventana: en Linux, sobre un X11 virtual.
      - name: X11 virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast

      - name: Clippy (map-images)
        run: cargo clippy -p jase-core --all-targets --features map-images -- -D warnings

      - name: Tests (map-images)
        run: cargo test -p jase-core --features map-images
