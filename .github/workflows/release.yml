name: Release

# Un tag vX.Y.Z arma los paquetes con package.yml (que comprueba que el tag es la versión de
# rust/Cargo.toml) y los sube como borrador y prerelease; publicarla es a mano
# (docs/desarrollo/publicar.md). A mano (workflow_dispatch) solo arma los paquetes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: JASE-${{ needs.package.outputs.version }}-*
          merge-multiple: true

      # Borrador: nadie lo ve hasta revisarlo (la 1.3.0 instalada ofrece las prereleases).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: true
          name: JASE ${{ needs.package.outputs.version }}
          body_path: packaging/release-notes.md
          files: |
            JASE-${{ needs.package.outputs.version }}-win64.zip
            JASE-${{ needs.package.outputs.version }}-setup.exe
            JASE-${{ needs.package.outputs.version }}-x86_64.AppImage
          fail_on_unmatched_files: true
