name: Release

# Un tag vX.Y.Z arma los paquetes con package.yml (que comprueba que el tag es la versión de
# rust/Cargo.toml) y los sube como borrador y prerelease; publicarla es a mano
# (docs/desarrollo/publicar.md). A mano (workflow_dispatch) solo arma los paquetes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # softprops volvería borrador una release ya publicada y le cambiaría los assets.
      # La API por tag no devuelve borradores: relanzar sobre un borrador sigue sirviendo.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Falla cerrado: solo un 404 (sin release publicada) deja seguir.
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$code" in
            404) ;;
            200) echo "La release $TAG ya está publicada: un arreglo es la versión siguiente"; exit 1 ;;
            *) echo "No se pudo comprobar la release $TAG (HTTP $code)"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: JASE-${{ needs.package.outputs.version }}-*
          merge-multiple: true

      # Borrador: nadie lo ve hasta revisarlo (la 1.3.0 instalada ofrece las prereleases).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: true
          name: JASE ${{ needs.package.outputs.version }}
          body_path: packaging/release-notes.md
          files: |
            JASE-${{ needs.package.outputs.version }}-win64.zip
            JASE-${{ needs.package.outputs.version }}-setup.exe
            JASE-${{ needs.package.outputs.version }}-x86_64.AppImage
          fail_on_unmatched_files: true
