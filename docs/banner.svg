<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="JASE - Jimmy's All Seeing Eye">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iris" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b6fff7"/>
      <stop offset=".55" stop-color="#19f5e1"/>
      <stop offset="1" stop-color="#0a8f86"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#19f5e1" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0b0f14"/>
  <rect width="1280" height="320" fill="url(#scan)"/>
  <g transform="translate(70,40) scale(1.875)">
    <g stroke="#19f5e1" stroke-width="3" opacity=".45" stroke-linecap="round">
      <path d="M64 6 V0"/><path d="M40 14 L34 6"/><path d="M88 14 L94 6"/><path d="M22 30 L12 24"/><path d="M106 30 L116 24"/>
    </g>
    <path d="M64 40 L112 116 H16 Z" fill="none" stroke="#19f5e1" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    <g stroke="#19f5e1" stroke-width="2" opacity=".35"><path d="M38 96 H90"/><path d="M28 106 H100"/></g>
    <path d="M48 26 L64 4 L80 26 Z" fill="#19f5e1" filter="url(#glow)"/>
    <path d="M67 11 V20 Q67 24 63 24 Q60 24 59.5 21.5" fill="none" stroke="#0b0f14" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 84 Q64 62 88 84 Q64 104 40 84 Z" fill="none" stroke="#19f5e1" stroke-width="4"/>
    <circle cx="64" cy="84" r="9" fill="url(#iris)"/>
  </g>
  <text x="350" y="170" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="120" font-weight="bold" fill="#19f5e1" filter="url(#glow)" letter-spacing="8">JASE</text>
  <text x="356" y="222" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="34" fill="#d7dbe2">Jimmy's All Seeing Eye</text>
  <text x="356" y="262" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="22" fill="#7c8494">The server browser your classic shooters still deserve</text>
</svg>
