[package]
name = "jase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Navegador de servidores de juegos clásicos"

[[bin]]
name = "jase"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "x11", "wayland", "tokio", "crisp", "linux-theme-detection", "svg", "advanced", "image-without-codecs"] }
futures = "0.3.34"
indexmap = "2"
keyring-core = "1"
jase-core = { path = "../jase-core", features = ["map-images"] }
png = "0.18"
resvg = "0.45"
# Selectores de archivo sin GTK: el portal XDG (libdbus por `dlopen`) o `zenity`; en Windows,
# `IFileDialog`.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util"] }

[target.'cfg(not(windows))'.dependencies]
# La bandeja (StatusNotifierItem) y sus globos (`org.freedesktop.Notifications`) por D-Bus en
# Rust puro. `async-io` y no `tokio`: es el `zbus` del llavero, y las dos features chocan.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
libc = "0.2"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
# Secret Service por D-Bus en Rust puro (sin libdbus ni OpenSSL), como `keyring` de Python.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Sin `toml`: no se leen metadatos de `Cargo.toml`, todo va en `build.rs`.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# El runtime de Iced (ya en el árbol de `iced`) para correr las `Task` en los tests.
iced_runtime = "0.14.0"
# Mide la vista sin ventana en los tests de layout (ya en el árbol de `iced`).
iced_tiny_skia = { version = "0.14", default-features = false }
proptest = "1"
# SHA-256 y zips de prueba para la actualización (ya en el árbol de `jase-core`).
ring = "0.17"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Reloj en pausa en los tests (`start_paused`): los plazos de los mensajes no hacen esperar.
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
tempfile = "3"
