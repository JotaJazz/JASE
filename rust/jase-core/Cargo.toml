[package]
name = "jase-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Núcleo de JASE sin UI: protocolos de servidores de juegos clásicos"

[dependencies]
flate2 = "1"
futures = "0.3.34"
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
ureq = "3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
