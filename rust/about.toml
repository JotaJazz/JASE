# Avisos de terceros del paquete (D7 de la fase 6): `cargo about generate -c about.toml about.hbs`.
# El mismo archivo para los dos paquetes, por eso suma las dependencias de Linux y de Windows.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring"]
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Pedidas por cargo about, permisivas: ksni (Unlicense) y webpki-roots (CDLA-Permissive-2.0).
    "Unlicense",
    "CDLA-Permissive-2.0",
]
