[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jase"
version = "0.14.0"
description = "Jimmy's All Seeing Eye - a server browser for classic multiplayer shooters"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9", "keyring>=24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff==0.17.2", "mypy==2.4.0"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
jase = "jase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Banderas de flag-icons (MIT, ver assets/flags/LICENSE).
jase = ["assets/flags/*.svg", "assets/flags/LICENSE", "assets/icons/*.svg",
        "assets/app_icon.svg", "assets/app_icon_small.svg", "assets/app_icon.ico",
        "assets/masters.json", "assets/win98/*.svg",
        "assets/icons/win98/*.svg", "assets/icons/xp/*.svg", "assets/luna/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Sin "I": reordenaría todos los imports, ruido sin valor por ahora.
select = ["E", "F", "W", "B", "UP"]
ignore = [
    # QModelIndex() como default es el idioma de las firmas de QAbstractItemModel en PySide6.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Datos y CSS en líneas largas deliberadas.
"scripts/screenshot.py" = ["E501"]
"scripts/gen_countries_en.py" = ["E501"]
"src/jase/ui/theme.py" = ["E501"]
# Tests: fixtures y aserciones compactas (; en una línea, lambdas, líneas largas).
"tests/*" = ["E501", "E702", "E731", "E402", "B007", "UP031"]

[tool.mypy]
python_version = "3.11"
files = ["src/jase"]
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# Los mixins de MainWindow usan atributos que define MainWindow, no el mixin. mypy no admite
# comodines parciales (window_*): la lista la vigila tests/test_packaging_meta.py.
module = [
    "jase.ui.window_actions",
    "jase.ui.window_auto_refresh",
    "jase.ui.window_background",
    "jase.ui.window_connect",
    "jase.ui.window_favorites",
    "jase.ui.window_friends",
    "jase.ui.window_history",
    "jase.ui.window_links",
    "jase.ui.window_player_search",
    "jase.ui.window_presets",
    "jase.ui.window_settings",
    "jase.ui.window_slot_watch",
    "jase.ui.window_state",
    "jase.ui.window_tray",
]
disable_error_code = ["attr-defined"]
