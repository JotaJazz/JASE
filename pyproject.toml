[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jase"
version = "0.9.0"
description = "Jimmy's All Seeing Eye - a game server browser for classic shooters (Call of Duty, Quake III, Wolfenstein, Unreal Tournament, Medal of Honor, Jedi Academy, Soldier of Fortune II, Counter-Strike 1.6, Battlefield 1942)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9", "keyring>=24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
jase = "jase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Banderas de flag-icons (MIT, ver assets/flags/LICENSE).
jase = ["assets/flags/*.svg", "assets/flags/LICENSE", "assets/icons/*.svg",
        "assets/app_icon.svg", "assets/app_icon_small.svg", "assets/app_icon.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
