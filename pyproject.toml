[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jase"
version = "0.1.0"
description = "Jimmy's All Seeing Eye - navegador de servidores para CoD1, CoD2 y UT99"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9", "keyring>=24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
jase = "jase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Banderas de flag-icons (MIT, ver assets/flags/LICENSE).
jase = ["assets/flags/*.svg", "assets/flags/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
